name: Windows x64 tagged release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ZombieMall.sln
      - name: Build
        run: dotnet build ZombieMall.sln --configuration Release --no-restore -m:1
      - name: Run regression executable
        run: dotnet run --project tests/Ashen.Tests/Ashen.Tests.csproj --configuration Release --no-build
      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          dotnet publish src/Ashen.Game/Ashen.Game.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -m:1 -o dist/game
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/Prepare-Windows.ps1 -PublishDir dist/game
      - name: Create ZIP and SHA-256 checksum
        shell: pwsh
        run: |
          $name = "ZombieMall-win-x64-${{ github.ref_name }}.zip"
          Compress-Archive -Path dist/game/* -DestinationPath (Join-Path dist $name) -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path dist $name)).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii (Join-Path dist "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ZombieMall-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Create GitHub release and attach files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          body_path: RELEASE_NOTES.md
